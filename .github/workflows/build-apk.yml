name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone submodules
        run: |
          rm -rf clash-ui clash-core clash-cache
          git clone https://github.com/alwaqyhsyn752-eng/clash-ui.git clash-ui
          git clone https://github.com/alwaqyhsyn752-eng/clash-core.git clash-core
          git clone https://github.com/alwaqyhsyn752-eng/clash-cache.git clash-cache

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - run: npm install

      - name: Build www
        run: |
          set -e
          rm -rf www
          mkdir -p www/game www/cache www/styles www/scripts

          cp clash-ui/index.html    www/index.html
          cp -r clash-ui/styles/*   www/styles/
          cp -r clash-ui/scripts/*  www/scripts/

          cp clash-core/index.html  www/game/index.html
          cp -r clash-core/config   www/game/
          cp -r clash-core/src      www/game/

          cp -r clash-cache/src/*   www/cache/

          sed -i 's|\.\./clash-cache/src/|../cache/|g' www/game/index.html
          sed -i 's|\.\./clash-cache/|../cache/|g'     www/game/index.html
          sed -i 's|\.\./clash-ui/|../|g'              www/game/index.html

          echo "=== checks ==="
          test -f www/index.html    && echo "OK index.html"
          test -f www/game/index.html && echo "OK game"

      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: clash-of-armored-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
