name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install npm dependencies
        run: npm install

      - name: Build www folder
        run: |
          mkdir -p www/game www/cache www/styles
          cp clash-ui/index.html www/index.html
          cp clash-ui/settings.html www/settings.html || true
          cp -r clash-ui/styles/* www/styles/ || true
          cp clash-core/index.html www/game/index.html
          cp -r clash-core/config www/game/ || true
          cp -r clash-core/src www/game/ || true
          cp -r clash-cache/src/* www/cache/ || true
          sed -i 's|\.\./clash-cache/|../cache/|g' www/game/index.html
          sed -i 's|\.\./clash-ui/|../|g' www/game/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clash-of-armored-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
