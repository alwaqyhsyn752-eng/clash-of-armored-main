<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>Clash of Armored - Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0d0d; touch-action: none;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      padding: 0 12px; background: rgba(26,26,26,0.9);
      border-bottom: 2px solid #4a4a4a;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'Courier New', monospace; color: #ff7b00;
      font-size: 14px; z-index: 10;
    }
    .top-bar .stat { display: flex; gap: 6px; align-items: center; }
    .hp-bar {
      width: 100px; height: 10px; background: #000;
      border: 1px solid #4a4a4a; border-radius: 2px; overflow: hidden;
    }
    .hp-fill { height: 100%; width: 100%; background: #4ade80; transition: width 0.2s; }
    .controls {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 5;
    }
    .pad { display: grid; gap: 8px; pointer-events: auto; }
    .pad-left { grid-template-columns: 60px 60px; grid-template-rows: 60px; }
    .pad-right { grid-template-columns: 70px; grid-template-rows: 70px 70px; }
    .btn-ctrl {
      background: rgba(90,110,61,0.85); border: 2px solid #7d9556;
      color: #fff; font-size: 24px; font-weight: bold; border-radius: 12px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.1s;
    }
    .btn-ctrl:active { background: rgba(255,123,0,0.95); transform: scale(0.95); }
    .fire-btn {
      position: fixed; bottom: 100px; right: 20px;
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff7b00, #cc5f00);
      border: 3px solid #ffb347; color: #fff; font-size: 28px;
      cursor: pointer; pointer-events: auto;
      box-shadow: 0 0 20px rgba(255,123,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 6;
    }
    .fire-btn:active { transform: scale(0.9); box-shadow: 0 0 30px rgba(255,123,0,0.9); }
    .map-info {
      position: fixed; top: 52px; left: 12px;
      font-family: 'Courier New', monospace; font-size: 11px; color: #7d9556;
      background: rgba(13,13,13,0.7); padding: 6px 10px; border-radius: 4px; z-index: 5;
    }
    .back-btn {
      background: none; border: none; color: #ff7b00; font-size: 22px;
      cursor: pointer; padding: 4px 10px; font-family: inherit;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="top-bar">
    <button class="back-btn" onclick="window.location.href='../clash-ui/index.html'">← القائمة</button>
    <div class="stat">
      <span>❤</span>
      <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
      <span id="hpText">100</span>
    </div>
    <div class="stat">
      <span>🎯</span>
      <span id="scoreText">0</span>
    </div>
  </div>

  <div class="map-info" id="mapInfo">جاري التحميل...</div>

  <div class="controls">
    <div class="pad pad-left">
      <button class="btn-ctrl" data-dir="left">↺</button>
      <button class="btn-ctrl" data-dir="right">↻</button>
    </div>
    <div class="pad pad-right">
      <button class="btn-ctrl" data-dir="up">▲</button>
      <button class="btn-ctrl" data-dir="down">▼</button>
    </div>
  </div>

  <button class="fire-btn" data-dir="fire">🔥</button>

  <!-- 1) الكاش -->
  <script src="../cache/cache.js"></script>
  <script src="../cache/resource-loader.js"></script>
  <script src="../cache/save-system.js"></script>
  <script>
    window.COA = {
      cache: new CoaCache(),
      loader: new ResourceLoader(new CoaCache()),
      saves: new SaveSystem(new CoaCache())
    };
    console.log('💾 Cache ready');
  </script>

  <!-- 2) الإعدادات -->
  <script src="config/game-config.js"></script>
  <script src="config/controls-config.js"></script>
  <script src="config/map-config.js"></script>

  <!-- 3) الكيانات -->
  <script src="src/maps/test-map.js"></script>
  <script src="src/entities/tank.js"></script>
  <script src="src/entities/projectile.js"></script>
  <script src="src/entities/enemy.js"></script>

  <!-- 4) الأنظمة -->
  <script src="src/systems/combat-system.js"></script>

  <!-- 5) حلقة اللعبة -->
  <script src="src/game.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const mapInfo = document.getElementById('mapInfo');
      if (window.MAP_CONFIG && window.MAP_CONFIG.map_01) {
        const m = window.MAP_CONFIG.map_01;
        mapInfo.textContent = `🗺 ${m.name} — صعوبة ${m.difficulty}`;
      }
      console.log('✅ Battle page loaded');
    });
  </script>
</body>
</html>
